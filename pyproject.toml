[project]
name = "aegisqa"
version = "0.1.0"
description = "AegisQA backend: REST + WebSocket API, Google ADK agents (Vertex AI Gemini), Playwright test execution"
requires-python = ">=3.10"
dependencies = [
  "google-adk[mcp]==2.11.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "cryptography>=42",
  "pillow>=10",
  "pixelmatch>=0.3",
  "pgvector>=0.3",
  "google-auth>=2.30",
  "google-cloud-firestore>=2.16",
  "google-cloud-storage>=2.16",
  "google-cloud-pubsub>=2.21",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "psycopg[binary]>=3.1", "websockets>=12"]

[project.scripts]
aegisqa-run-tests = "aegisqa.cli.run_tests:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aegisqa*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
  "browser: needs `npx @playwright/mcp` and installed Playwright browsers",
  "contract: black-box API tests against a running backend (CONTRACT_BASE_URL)",
]
